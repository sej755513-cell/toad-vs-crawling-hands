<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Toad vs. The Crawling Hands 3D</title>
  <style>
    :root {
      --bg1:#120c1d;
      --panel:#1f1530;
      --border:#ff4a4a;
      --accent:#ffdb4d;
      --text:#f4f7ff;
    }
    * { box-sizing: border-box; }
    html, body {
      margin:0; width:100%; height:100%;
      background: radial-gradient(circle at top, #2a1a3a 0%, var(--bg1) 52%, #080810 100%);
      color:var(--text);
      font-family: Segoe UI, system-ui, Arial, sans-serif;
      overflow:hidden;
    }
    canvas {
      display:block; width:100vw; height:100vh;
      background:#0f1320;
    }
    #hud {
      position:fixed; top:14px; left:16px; right:16px; z-index:50;
      display:flex; justify-content:space-between; align-items:center; gap:12px;
      pointer-events:none;
    }
    .box {
      background: rgba(27,22,38,0.85); border:3px solid var(--border); padding:10px 18px;
      font-weight:800; letter-spacing:1px; color:var(--text);
      box-shadow:0 0 28px rgba(255,80,80,0.1);
    }
    .title {
      position:fixed; top:76px; left:50%; transform:translateX(-50%);
      z-index:50; pointer-events:none;
      color:#ffd34d; font-weight:900; font-size:clamp(24px, 3vw, 48px);
      letter-spacing:2px; text-shadow: 3px 3px 0 #000;
      text-align:center;
      white-space:nowrap;
    }
    .controls {
      position:fixed; left:50%; bottom:18px; transform:translateX(-50%);
      z-index:50; display:flex; gap:12px; flex-wrap:wrap; justify-content:center;
      pointer-events:none;
    }
    .controls button {
      pointer-events:auto;
      background:#2a1d3c; color:white; border:2px solid var(--border);
      padding:10px 18px; font-weight:900; cursor:pointer;
      font-size:14px;
    }
    .menu-btn {
      pointer-events:auto;
      background:#2a1d3c; color:white; border:2px solid var(--border);
      padding:8px 14px; font-weight:800; cursor:pointer;
      margin-left:auto;
      margin-right:0;
    }
    .overlay {
      position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,0.65); z-index:100;
    }
    .panel {
      background:linear-gradient(180deg,#1d1730,#221436); border:3px solid var(--border); padding:18px; width:min(700px,90vw);
      color:var(--text);
    }
    .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:10px 0; }
    .muted { opacity:0.8; font-size:13px; }
    .tiny { font-size:12px; }
  </style>
</head>
<body>
  <div id="hud">
    <div class="box" id="hudText">MAP 1: MUSHROOM KINGDOM | COINS 0 | LIVES 3</div>
    <button class="menu-btn" id="menuBtn">☰ Menu</button>
  </div>
  <div class="title">TOAD VS. THE CRAWLING HANDS</div>

  <div class="controls">
    <button id="leftBtn">◀ LEFT</button>
    <button id="jumpBtn">JUMP ▲</button>
    <button id="rightBtn">RIGHT ▶</button>
    <button id="resetBtn">RESTART</button>
  </div>

  <div class="overlay" id="menuOverlay">
    <div class="panel">
      <h2 style="margin-top:0; color:#ffd34d;">Game Menu</h2>
      <div class="row"><label>Difficulty</label>
        <select id="difficultySelect">
          <option value="easy">Easy</option>
          <option value="normal" selected>Normal</option>
          <option value="hard">Hard</option>
        </select>
      </div>
      <div class="row"><label>Show FPS</label><input id="showFps" type="checkbox" /></div>
      <div class="row"><button id="resetProgressBtn">Reset Progress</button><button id="closeMenuBtn">Close</button></div>
      <div class="muted tiny">Classic 3D prototype inspired by low-poly platformers.</div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

    const hudText = document.getElementById('hudText');
    const menuOverlay = document.getElementById('menuOverlay');
    const showFpsBox = document.getElementById('showFps');
    const difficultySelect = document.getElementById('difficultySelect');
    const leftBtn = document.getElementById('leftBtn');
    const rightBtn = document.getElementById('rightBtn');
    const jumpBtn = document.getElementById('jumpBtn');
    const resetBtn = document.getElementById('resetBtn');
    const menuBtn = document.getElementById('menuBtn');
    const closeMenuBtn = document.getElementById('closeMenuBtn');
    const resetProgressBtn = document.getElementById('resetProgressBtn');

    const SAVE_KEY = 'toad-vs-hands-3d-save-v1';
    const SETTINGS_KEY = 'toad-vs-hands-3d-settings-v1';

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0d132a);
    scene.fog = new THREE.Fog(0x0d132a, 10, 60);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 4, 12);

    const hemi = new THREE.HemisphereLight(0xbfe8ff, 0x1a1a2a, 1.2);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xffffff, 1.3);
    sun.position.set(8, 18, 8);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -30;
    sun.shadow.camera.right = 30;
    sun.shadow.camera.top = 30;
    sun.shadow.camera.bottom = -30;
    scene.add(sun);

    const world = {
      platforms: [],
      coins: [],
      boss: null,
      level: 1,
      map: 0,
      lives: 3,
      coinsCollected: 0,
      win: false,
      timer: 0,
      difficulty: 'normal',
      showFps: false,
      keys: {},
      lastTime: 0,
      fps: 0
    };

    const player = {
      mesh: null,
      velocity: new THREE.Vector3(),
      radius: 0.75,
      height: 1.8,
      baseY: 1.8,
      onGround: false,
      jumpQueued: false,
      invuln: 0,
      speed: 9.5,
      jumpForce: 11.5
    };

    function loadSettings() {
      try {
        const raw = localStorage.getItem(SETTINGS_KEY);
        return raw ? Object.assign({ difficulty:'normal', showFps:false }, JSON.parse(raw)) : { difficulty:'normal', showFps:false };
      } catch {
        return { difficulty:'normal', showFps:false };
      }
    }

    function saveSettings() {
      localStorage.setItem(SETTINGS_KEY, JSON.stringify({ difficulty: world.difficulty, showFps: world.showFps }));
    }

    function loadProgress() {
      try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (!raw) return { map:0, level:1, lives:3, coinsCollected:0 };
        const parsed = JSON.parse(raw);
        return {
          map: Number(parsed.map) || 0,
          level: Number(parsed.level) || 1,
          lives: Number(parsed.lives) || 3,
          coinsCollected: Number(parsed.coinsCollected) || 0
        };
      } catch {
        return { map:0, level:1, lives:3, coinsCollected:0 };
      }
    }

    function saveProgress() {
      localStorage.setItem(SAVE_KEY, JSON.stringify({
        map: world.map,
        level: world.level,
        lives: world.lives,
        coinsCollected: world.coinsCollected
      }));
    }

    const saved = loadProgress();
    world.map = saved.map;
    world.level = saved.level;
    world.lives = saved.lives;
    world.coinsCollected = saved.coinsCollected;

    const settings = loadSettings();
    world.difficulty = settings.difficulty || 'normal';
    world.showFps = !!settings.showFps;
    difficultySelect.value = world.difficulty;
    showFpsBox.checked = world.showFps;

    function setHud() {
      hudText.textContent = `MAP ${world.map + 1}: MUSHROOM KINGDOM | COINS ${world.coinsCollected} | LIVES ${world.lives}`;
    }
    setHud();

    function makePlayer() {
      const group = new THREE.Group();

      const bodyMat = new THREE.MeshStandardMaterial({ color: 0x45c8ff, roughness: 0.7, metalness: 0.15 });
      const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.55, 1.1, 4, 8), bodyMat);
      body.castShadow = true;
      body.receiveShadow = true;
      body.position.y = 1.1;
      group.add(body);

      const head = new THREE.Mesh(new THREE.SphereGeometry(0.48, 20, 20), new THREE.MeshStandardMaterial({ color: 0xf7d9a3, roughness: 0.9 }));
      head.position.y = 2.2;
      head.castShadow = true;
      group.add(head);

      const eyeMat = new THREE.MeshStandardMaterial({ color: 0x111111, emissive:0x111111 });
      const eye1 = new THREE.Mesh(new THREE.SphereGeometry(0.08, 12, 12), eyeMat);
      const eye2 = new THREE.Mesh(new THREE.SphereGeometry(0.08, 12, 12), eyeMat);
      eye1.position.set(-0.14, 2.33, 0.42);
      eye2.position.set(0.14, 2.33, 0.42);
      group.add(eye1, eye2);

      const hat = new THREE.Mesh(new THREE.ConeGeometry(0.38, 0.6, 16), new THREE.MeshStandardMaterial({ color: 0xffd34d }));
      hat.position.y = 2.78;
      hat.castShadow = true;
      group.add(hat);

      group.position.set(0, 2, 0);
      scene.add(group);
      player.mesh = group;
    }

    function makePlatform(x, y, z, sx, sy, sz, color = 0x5f7d32) {
      const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.9, metalness: 0.08 });
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), mat);
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      world.platforms.push({ mesh, x, y, z, sx, sy, sz, minX:x-sx/2, maxX:x+sx/2, minY:y-sy/2, maxY:y+sy/2, minZ:z-sz/2, maxZ:z+sz/2 });
    }

    function makeGround() {
      const ground = new THREE.Mesh(
        new THREE.BoxGeometry(60, 2, 60),
        new THREE.MeshStandardMaterial({ color: 0x2b3f59, roughness: 0.95 })
      );
      ground.position.set(0, -1, 0);
      ground.castShadow = false;
      ground.receiveShadow = true;
      scene.add(ground);
      world.platforms.push({ mesh: ground, x:0, y:-1, z:0, sx:60, sy:2, sz:60, minX:-30, maxX:30, minY:-2, maxY:0, minZ:-30, maxZ:30 });
    }

    function makeCoin(x, y, z) {
      const coin = new THREE.Mesh(
        new THREE.TorusGeometry(0.48, 0.16, 12, 22),
        new THREE.MeshStandardMaterial({ color: 0xffd34d, emissive: 0x6a5200, metalness: 0.5, roughness: 0.35 })
      );
      coin.rotation.x = Math.PI / 2;
      coin.position.set(x, y, z);
      coin.castShadow = true;
      scene.add(coin);
      world.coins.push({ mesh: coin, x, y, z, collected: false });
    }

    function makeBoss() {
      const boss = new THREE.Mesh(
        new THREE.BoxGeometry(2.4, 2.4, 2.4),
        new THREE.MeshStandardMaterial({ color: 0xff4a4a, emissive: 0x3d0000, roughness: 0.5 })
      );
      boss.position.set(18, 1.8, 0);
      boss.castShadow = true;
      scene.add(boss);
      world.boss = { mesh: boss, hp: 4, maxHp: 4, alive: true };
    }

    function levelLayout() {
      makeGround();
      makePlatform(0, 1.5, 0, 6, 0.8, 6, 0x6c8e3d);
      makePlatform(-6, 3.2, -2, 5, 0.8, 5, 0x7a4d1f);
      makePlatform(6, 4.4, 2, 5, 0.8, 5, 0x7a4d1f);
      makePlatform(0, 6.4, -5, 6, 0.8, 5, 0x8a6a29);
      makePlatform(12, 7.8, 0, 5.5, 0.8, 5.5, 0x8c5631);
      makePlatform(19, 3.8, -3, 5, 0.8, 5, 0x718b42);
      makePlatform(16, 1.5, 8, 11, 0.8, 5, 0x4d6b2a);
      makePlatform(0, 2.8, 8, 5, 0.8, 5, 0x7d6b2a);
      for (let i = 0; i < 12; i++) {
        const x = -18 + i * 3.4;
        const y = 1.2 + (i % 3) * 0.9;
        const z = (i % 2 === 0 ? -6 : 7) + (i % 4) * 0.7;
        makePlatform(x, y, z, 2.4, 0.5, 2.4, 0x7d9350);
      }
      for (let i = -2; i <= 2; i++) {
        makeCoin(i * 3, 2.7 + (Math.abs(i) * 0.5), 4.2);
      }
      makeCoin(-7.2, 5.0, -1.6);
      makeCoin(7.0, 5.7, 3.2);
      makeCoin(0, 8.0, -5.2);
      makeCoin(12.5, 9.0, 0.7);
      makeCoin(19.0, 5.3, -3.2);
      makeBoss();
    }

    function resetWorld() {
      // Clear previous platform/coin meshes from scene
      world.platforms.forEach(p => scene.remove(p.mesh));
      world.coins.forEach(c => scene.remove(c.mesh));
      if (world.boss) scene.remove(world.boss.mesh);
      world.platforms = [];
      world.coins = [];
      world.boss = null;
      levelLayout();
      if (player.mesh) {
        player.mesh.position.set(0, 2, 0);
        player.mesh.rotation.set(0, 0, 0);
      }
      player.velocity.set(0, 0, 0);
      player.onGround = false;
      player.invuln = 0;
      setHud();
    }

    function setDifficulty(value) {
      world.difficulty = value;
      switch (value) {
        case 'easy': player.speed = 10.6; player.jumpForce = 12.5; break;
        case 'hard': player.speed = 8.4; player.jumpForce = 10.8; break;
        default: player.speed = 9.5; player.jumpForce = 11.5; break;
      }
      saveSettings();
    }

    function tryJump() {
      if (!player.mesh) return;
      if (player.onGround) {
        player.velocity.y = player.jumpForce;
        player.onGround = false;
      }
    }

    function getPlayerAABB() {
      return {
        minX: player.mesh.position.x - player.radius,
        maxX: player.mesh.position.x + player.radius,
        minY: player.mesh.position.y - player.height * 0.5,
        maxY: player.mesh.position.y + player.height * 0.5,
        minZ: player.mesh.position.z - player.radius,
        maxZ: player.mesh.position.z + player.radius
      };
    }

    function updatePlayer(dt) {
      if (!player.mesh) return;
      const move = new THREE.Vector3();

      if (world.keys['KeyA'] || world.keys['ArrowLeft']) move.x -= 1;
      if (world.keys['KeyD'] || world.keys['ArrowRight']) move.x += 1;
      if (world.keys['KeyW'] || world.keys['ArrowUp']) move.z -= 1;
      if (world.keys['KeyS'] || world.keys['ArrowDown']) move.z += 1;

      if (move.lengthSq() > 0) move.normalize();
      const forward = new THREE.Vector3(0, 0, -1);
      const right = new THREE.Vector3(1, 0, 0);
      const targetVel = new THREE.Vector3();
      targetVel.addScaledVector(right, move.x * player.speed);
      targetVel.addScaledVector(forward, move.z * player.speed);

      player.velocity.x = THREE.MathUtils.lerp(player.velocity.x, targetVel.x, 0.15);
      player.velocity.z = THREE.MathUtils.lerp(player.velocity.z, targetVel.z, 0.15);
      player.velocity.y -= 28 * dt;

      const nextPos = player.mesh.position.clone();
      nextPos.x += player.velocity.x * dt;
      nextPos.z += player.velocity.z * dt;
      nextPos.y += player.velocity.y * dt;

      const oldY = player.mesh.position.y;
      player.mesh.position.x = nextPos.x;
      player.mesh.position.z = nextPos.z;
      player.mesh.position.y = nextPos.y;

      player.onGround = false;
      for (const platform of world.platforms) {
        const pad = 0.25;
        const box = {
          minX: platform.minX - player.radius,
          maxX: platform.maxX + player.radius,
          minY: platform.minY - player.height * 0.5,
          maxY: platform.maxY + player.height * 0.5,
          minZ: platform.minZ - player.radius,
          maxZ: platform.maxZ + player.radius
        };

        const insideX = player.mesh.position.x > box.minX && player.mesh.position.x < box.maxX;
        const insideZ = player.mesh.position.z > box.minZ && player.mesh.position.z < box.maxZ;
        const insideY = player.mesh.position.y > box.minY && player.mesh.position.y < box.maxY;

        if (insideX && insideZ && insideY) {
          const prevBottom = oldY - player.height * 0.5;
          const currentBottom = player.mesh.position.y - player.height * 0.5;
          const platformTop = platform.maxY + 0.1;
          if (prevBottom >= platformTop - 0.5 && currentBottom <= platformTop) {
            player.mesh.position.y = platform.maxY + player.height * 0.5 + 0.06;
            player.velocity.y = 0;
            player.onGround = true;
          }
        }
      }

      if (player.mesh.position.y < -8) {
        player.mesh.position.set(0, 2, 0);
        player.velocity.set(0, 0, 0);
        world.lives -= 1;
        if (world.lives <= 0) {
          world.lives = 3;
          world.coinsCollected = 0;
        }
        setHud();
        saveProgress();
      }

      for (const coin of world.coins) {
        if (!coin.collected) {
          const dx = player.mesh.position.x - coin.x;
          const dy = player.mesh.position.y - coin.y;
          const dz = player.mesh.position.z - coin.z;
          if (Math.hypot(dx, dy, dz) < 1.2) {
            coin.collected = true;
            coin.mesh.visible = false;
            world.coinsCollected += 1;
            setHud();
            saveProgress();
          }
        }
      }

      if (world.boss && world.boss.alive) {
        const dist = player.mesh.position.distanceTo(world.boss.mesh.position);
        if (dist < 1.8) {
          if (player.mesh.position.y > world.boss.mesh.position.y + 1.2 && player.velocity.y < 0) {
            world.boss.hp -= 1;
            player.velocity.y = 7.5;
            if (world.boss.hp <= 0) {
              world.boss.alive = false;
              world.boss.mesh.visible = false;
              world.win = true;
            }
          } else {
            player.mesh.position.set(0, 2, 0);
            world.lives -= 1;
            if (world.lives <= 0) {
              world.lives = 3;
              world.coinsCollected = 0;
            }
          }
          setHud();
          saveProgress();
        }
      }

      const facing = new THREE.Vector3(player.velocity.x, 0, player.velocity.z);
      if (facing.lengthSq() > 0.001) {
        player.mesh.rotation.y = Math.atan2(facing.x, facing.z) + Math.PI;
      }
    }

    function updateCamera(dt) {
      const focus = player.mesh.position.clone();
      const desired = new THREE.Vector3(focus.x, focus.y + 3.8, focus.z + 9.2);
      camera.position.lerp(desired, 0.08);
      camera.lookAt(focus.x, focus.y + 1.4, focus.z);
    }

    function animate() {
      requestAnimationFrame(animate);
      const now = performance.now();
      const dt = Math.min((now - (world.lastTime || now)) / 1000, 0.033);
      world.lastTime = now;
      world.timer += dt;

      if (player.mesh) updatePlayer(dt);
      updateCamera(dt);

      if (world.boss && world.boss.alive) {
        world.boss.mesh.position.y = 1.8 + Math.sin(world.timer * 2.5) * 0.25;
      }

      renderer.render(scene, camera);

      if (world.showFps) {
        world.fps = 1 / Math.max(dt, 0.001);
        const fpsText = document.createElement('div');
        fpsText.id = 'fpsOverlay';
        if (!document.getElementById('fpsOverlay')) {
          fpsText.style.position = 'fixed';
          fpsText.style.right = '14px';
          fpsText.style.top = '14px';
          fpsText.style.zIndex = '90';
          fpsText.style.background = 'rgba(0,0,0,0.5)';
          fpsText.style.padding = '8px 10px';
          fpsText.style.border = '1px solid rgba(255,255,255,0.2)';
          fpsText.style.fontFamily = 'monospace';
          fpsText.style.fontSize = '12px';
          fpsText.style.color = '#fff';
          document.body.appendChild(fpsText);
        }
        document.getElementById('fpsOverlay').textContent = `FPS: ${world.fps.toFixed(1)}`;
      } else {
        const f = document.getElementById('fpsOverlay');
        if (f) f.remove();
      }
    }

    function resetProgress() {
      localStorage.removeItem(SAVE_KEY);
      localStorage.removeItem(SETTINGS_KEY);
      window.location.reload();
    }

    function bindUI() {
      window.addEventListener('keydown', (e) => {
        world.keys[e.code] = true;
        if (e.code === 'Space') {
          e.preventDefault();
          tryJump();
        }
      });
      window.addEventListener('keyup', (e) => {
        world.keys[e.code] = false;
      });

      leftBtn.addEventListener('pointerdown', () => { world.keys['KeyA'] = true; });
      leftBtn.addEventListener('pointerup', () => { world.keys['KeyA'] = false; });
      leftBtn.addEventListener('pointerleave', () => { world.keys['KeyA'] = false; });
      rightBtn.addEventListener('pointerdown', () => { world.keys['KeyD'] = true; });
      rightBtn.addEventListener('pointerup', () => { world.keys['KeyD'] = false; });
      rightBtn.addEventListener('pointerleave', () => { world.keys['KeyD'] = false; });
      jumpBtn.addEventListener('click', tryJump);
      resetBtn.addEventListener('click', () => {
        player.mesh.position.set(0, 2, 0);
        player.velocity.set(0, 0, 0);
      });

      menuBtn.addEventListener('click', () => menuOverlay.style.display = 'flex');
      closeMenuBtn.addEventListener('click', () => menuOverlay.style.display = 'none');
      difficultySelect.addEventListener('change', (e) => {
        world.difficulty = e.target.value;
        setDifficulty(world.difficulty);
      });
      showFpsBox.addEventListener('change', (e) => {
        world.showFps = e.target.checked;
        saveSettings();
      });
      resetProgressBtn.addEventListener('click', () => {
        resetProgress();
      });
    }

    function init() {
      setDifficulty(world.difficulty);
      makePlayer();
      resetWorld();
      bindUI();
      animate();
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    init();
  </script>
</body>
</html>
